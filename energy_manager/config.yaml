name: Energy Manager (Gen2)
version: "0.8.0"
slug: energy_manager
description: Curtails solar production when exporting costs money, maximizing self-consumption
url: https://github.com/vdvm/energy-manager-gen2-hass
arch:
  - aarch64
  - amd64
image: ghcr.io/vdvm/energy-manager-app
init: false
startup: services
boot: auto
options:
  installation:
    timezone: "Europe/Amsterdam"
    core_window_fraction: 0.7
    location:
      latitude: 999.0
      longitude: 999.0
    roof: {}
  measurement:
    adapter: homewizard_p1
    stale_after_s: 10
    homewizard_p1:
      host: ""
      token: ""
      tls: verify
  inverter:
    adapter: solaredge_modbus
    rated_power_w: 0
    min_limit_pct: 0
    solaredge_modbus:
      host: ""
      port: 1502
      unit_id: 1
  controller:
    interval: "2s"
    on_stop_action: reset_100
    base_load_w: 0
    setpoint:
      magnitude_w: 60
      direction: export
    deadband:
      below_w: 40
      above_w: 40
  pattern_recognition:
    enabled: true
  price:
    contract: dynamic
    resolution: hourly
    vat_rate: 0.0
    import_fee_eur_kwh_incl_vat: -1.0
    export_fee_eur_kwh_incl_vat: -1.0
    energy_tax_eur_kwh_incl_vat: -1.0
    source:
      adapter: frank_energie
  outputs:
    log_level: info
    home_assistant:
      adapter: mqtt
      mqtt:
        host: "core-mosquitto"
        port: 1883
        username: ""
        password: ""
        discovery_prefix: ""
        topic_prefix: ""
    recorder: {}
schema:
  installation:
    timezone: str?
    core_window_fraction: float?
    location:
      latitude: float?
      longitude: float?
    roof:
      azimuth_deg: float?
      tilt_deg: float?
  measurement:
    adapter: list(homewizard_p1)?
    stale_after_s: int?
    homewizard_p1:
      host: str?
      token: password?
      tls: list(verify|accept_self_signed)?
  inverter:
    adapter: list(solaredge_modbus)?
    rated_power_w: int?
    min_limit_pct: int?
    solaredge_modbus:
      host: str?
      port: port?
      unit_id: int?
  controller:
    interval: str?
    on_stop_action: list(reset_100|leave)?
    base_load_w: int?
    setpoint:
      magnitude_w: int?
      direction: list(export|import)?
    deadband:
      below_w: int?
      above_w: int?
  pattern_recognition:
    enabled: bool?
  price:
    contract: list(fixed|dynamic)?
    resolution: list(hourly|quarter_hourly)?
    vat_rate: float?
    import_fee_eur_kwh_incl_vat: float?
    export_fee_eur_kwh_incl_vat: float?
    energy_tax_eur_kwh_incl_vat: float?
    source:
      adapter: list(frank_energie)?
  outputs:
    log_level: list(error|warn|info|debug)?
    home_assistant:
      adapter: list(mqtt)?
      mqtt:
        host: str?
        port: port?
        username: str?
        password: password?
        discovery_prefix: str?
        topic_prefix: str?
    recorder:
      path: str?
      retention_days: int?
